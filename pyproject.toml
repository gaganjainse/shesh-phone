[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shesh-phone"
version = "0.1.0"
description = "Shesh Phone: safe Android device control over ADB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<1"]
# TemplateVision (vision_loop) requires pillow at runtime
vision = ["pillow>=11.1.0"]

[tool.uv]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE+TRY are errors, not style: blind `except Exception` is where silent
# failures live. See shesh-ecosystem/docs (2026-08-12 silent-failure sweep).
extend-select = ["BLE", "TRY"]
select = ["E", "F", "W", "UP", "B", "SIM", "I"]
ignore = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
